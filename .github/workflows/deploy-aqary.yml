name: Deploy aqary via FTP

on:
  push:
    branches: [main]
    paths:
      - 'hanet/aqary/**'
      - '.github/workflows/deploy-aqary.yml'
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one
concurrency:
  group: deploy-aqary
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload hanet/aqary to /public_html/aqary
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./hanet/aqary/
          server-dir: /public_html/aqary/
          timeout: 600000
          # Server-specific config files: never upload, overwrite or delete these
          exclude: |
            **/.git*
            **/.git*/**
            **/connectdb.hnt
            **/.htaccess
            **/offer.connectdb.hnt
            **/connectofferdb.hnt
