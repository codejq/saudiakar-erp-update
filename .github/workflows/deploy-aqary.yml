name: Deploy aqary via FTP

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload hanet/aqary to /public_html/aqary
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./hanet/aqary/
          server-dir: /public_html/aqary/
          timeout: 600000
          # Server-specific config files: never upload, overwrite or delete these
          exclude: |
            **/.git*
            **/.git*/**
            **/connectdb.hnt
            **/.htaccess
            **/offer.connectdb.hnt
            **/connectofferdb.hnt
